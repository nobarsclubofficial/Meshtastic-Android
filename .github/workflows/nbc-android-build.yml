name: NBC Android Build

on:
  push:
    branches:
      - feature/nbc-tak-atak
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: 30000000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build F-Droid debug APK
        run: ./gradlew :androidApp:assembleFdroidDebug -Pci=true --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: no-bars-connect-fdroid-debug
          path: androidApp/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
