name: NBC Android Build

on:
  push:
    branches:
      - feature/nbc-tak-atak
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: 30000000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      # RC/test signing only. The repository's checked-in shared debug key keeps
      # test installs update-compatible while the release build type itself remains
      # non-debuggable. Production releases should use a private No Bars Club key.
      - name: Configure RC signing
        run: |
          cat > keystore.properties <<'EOF'
          storeFile=../config/debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Build No Bars Connect release candidate
        run: ./gradlew :androidApp:assembleFdroidRelease -Pci=true --stacktrace

      - name: Stage release candidate APKs
        run: |
          mkdir -p nbc-release
          find androidApp/build/outputs/apk/fdroid/release -name '*.apk' -type f | while read -r apk; do
            base="$(basename "$apk")"
            case "$base" in
              *arm64-v8a*) out="NoBarsConnect-RC2-arm64-v8a.apk" ;;
              *armeabi-v7a*) out="NoBarsConnect-RC2-armeabi-v7a.apk" ;;
              *universal*) out="NoBarsConnect-RC2-universal.apk" ;;
              *) out="NoBarsConnect-RC2-${base}" ;;
            esac
            cp "$apk" "nbc-release/$out"
          done
          ls -lh nbc-release

      - name: Upload release candidate APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: no-bars-connect-rc2
          path: nbc-release/*.apk
          if-no-files-found: error
          retention-days: 14
